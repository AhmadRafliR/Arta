  <rect class="frame" x="66" y="30" width="152" height="200" rx="24"/>
  <path class="line" d="M96 72 H188"/>
  <path class="line" d="M96 106 H166"/>
  <path class="line" d="M96 140 H188"/>
  <path class="line" d="M96 174 H150"/>
