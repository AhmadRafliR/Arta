<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="200" height="64" role="img" aria-label="Badge tier Free arta">
  <title>Badge tier Free</title>
  <style>
    :root{
      --teal-deep:#0B424F;
      --text-secondary:#5B7C84;
      --line:#DDE7EA;
      --surface:#FFFFFF;
      --badge-font:'Avenir Next','Century Gothic',Futura,'Trebuchet MS',sans-serif;
    }
    .badge-bg{ fill:var(--surface); stroke:var(--line); stroke-width:2; }
    .badge-glyph{ fill:none; stroke:var(--text-secondary); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .badge-label{ fill:var(--teal-deep); font-family:var(--badge-font); font-size:22px; font-weight:600; letter-spacing:1px; }
    .badge-dot{ fill:var(--text-secondary); }
  </style>
  <rect class="badge-bg" x="1" y="1" width="198" height="62" rx="31"/>
  <rect class="badge-glyph" x="18" y="22" width="22" height="15" rx="4"/>
  <path class="badge-glyph" d="M29 29.5 H40 V37 H29"/>
  <circle class="badge-dot" cx="17" cy="29.5" r="2.4"/>
  <text class="badge-label" x="56" y="40">Free</text>
</svg>