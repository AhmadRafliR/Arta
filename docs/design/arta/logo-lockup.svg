<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320" role="img" aria-label="Lockup logo arta: mark celengan koin dan wordmark arta">
  <title>Logo lockup arta</title>
  <style>
    :root{
      --teal-deep:#0B424F;
      --teal:#1F6A76;
      --mint:#52C3BF;
      --text-secondary:#5B7C84;
      --divider:#DDE7EA;
      --wordmark-font:'Avenir Next','Century Gothic',Futura,'Trebuchet MS',sans-serif;
    }
    .mark-body{ fill:url(#lockupGradient); }
    .mark-accent{ fill:var(--mint); }
    .wordmark{
      fill:var(--teal-deep);
      font-family:var(--wordmark-font);
      font-size:72px;
      font-weight:600;
      letter-spacing:3px;
    }
    .tagline{
      fill:var(--text-secondary);
      font-family:var(--wordmark-font);
      font-size:20px;
      font-weight:400;
      letter-spacing:4px;
    }
    .rule{ stroke:var(--divider); stroke-width:2; }
  </style>
  <defs>
    <linearGradient id="lockupGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B424F"/>
      <stop offset="1" stop-color="#1F6A76"/>
    </linearGradient>
  </defs>
  <g transform="translate(140 160) scale(0.62) translate(-256 -256)">
    <g class="mark-body">
      <circle cx="267" cy="256" r="150"/>
      <rect x="95" y="226" width="96" height="96" rx="48"/>
    </g>
    <g class="mark-accent">
      <rect x="225" y="148" width="84" height="20" rx="10"/>
      <circle cx="130" cy="262" r="8"/>
      <circle cx="130" cy="286" r="8"/>
    </g>
  </g>
  <line class="rule" x1="264" y1="110" x2="264" y2="210"/>
  <text class="wordmark" x="300" y="178">arta</text>
  <text class="tagline" x="302" y="214">Own Your Money</text>
</svg>
