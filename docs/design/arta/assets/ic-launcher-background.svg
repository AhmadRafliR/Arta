<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Lapisan belakang adaptive icon arta, gradien teal">
  <title>Adaptive icon background</title>
  <defs>
    <linearGradient id="adaptiveBg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B424F"/>
      <stop offset="1" stop-color="#1F6A76"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="108" height="108" fill="url(#adaptiveBg)"/>
</svg>